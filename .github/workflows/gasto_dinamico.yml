name: Gasto Dinamico

on:
  repository_dispatch:
    types: [gasto_dinamico]

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ_SISTEMA: ${{ vars.TZ_SISTEMA }}
          CURRENCY_SYMBOL: ${{ vars.CURRENCY_SYMBOL }}
          CUENTA: ${{ github.event.client_payload.cuenta }}
          FECHA: ${{ github.event.client_payload.fecha }}
          LINEAS: ${{ toJson(github.event.client_payload.lineas) }}
        run: python scripts/ingesta_dinamica.py
