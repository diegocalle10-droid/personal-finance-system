name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate workflow YAML
        run: python -c "import glob,yaml;[yaml.safe_load(open(p)) for p in glob.glob('.github/workflows/*.yml')];print('yaml ok')"

      - name: Run tests
        run: pytest -q
